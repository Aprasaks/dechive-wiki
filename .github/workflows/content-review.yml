name: Offline content review checks
on:
  push:
    branches: [content/pompeii-first-entry]
  pull_request:
    paths: ['content/**', '.github/workflows/content-review.yml']
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install pinned authoring dependency in isolated environment
        run: |
          python3 -m venv /tmp/dechive-review-env
          /tmp/dechive-review-env/bin/python -m pip install -r content/requirements-review.txt
      - name: Check authoring and offline rendering isolation
        run: |
          /tmp/dechive-review-env/bin/python content/validate_frontmatter.py content/drafts/pompeii.en.md
          /tmp/dechive-review-env/bin/python -m unittest discover -s content -p test_review.py -v
      - name: Verify tracked review bundle is reproducible
        run: |
          /tmp/dechive-review-env/bin/python content/build_review.py content/drafts/pompeii.en.md content/reviews/pompeii.en.html
          git diff --exit-code -- content/reviews/
