name: Private review regression
on:
  workflow_dispatch:
  push:
    branches: [test/private-review-regression-20261123]
permissions:
  contents: read
jobs:
  approved-evidence:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: testdb
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d testdb"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      PGPASSWORD: test-only
      PGHOST: 127.0.0.1
      PGUSER: postgres
      PGDATABASE: testdb
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: psql -v ON_ERROR_STOP=1 -f db/001_knowledge_core_p0.sql
      - run: psql -v ON_ERROR_STOP=1 -f db/002_review_integrity_p0.sql
      - run: psql -v ON_ERROR_STOP=1 -v reader_password=synthetic -f experiments/payload-g1/sql/001_http_reader.sql
      - run: psql -v ON_ERROR_STOP=1 -f experiments/payload-g1/sql/006_public_evidence.sql
      - run: psql -v ON_ERROR_STOP=1 -f experiments/payload-g1/sql/007_revision_metadata.sql
      - run: psql -v ON_ERROR_STOP=1 -f infra/studio/direct-publication.sql
      - run: psql -v ON_ERROR_STOP=1 -c 'CREATE ROLE kg_studio_publish'
      - run: psql -v ON_ERROR_STOP=1 -f infra/studio/approved-evidence-existing-test.sql
      - run: psql -v ON_ERROR_STOP=1 -f infra/studio/approved-evidence-bridge.sql
      - run: psql -v ON_ERROR_STOP=1 -f infra/studio/approved-evidence-bridge-test.sql
      - run: psql -v ON_ERROR_STOP=1 -c "CREATE ROLE kg_g1_candidate_probe LOGIN"
      - run: psql -v ON_ERROR_STOP=1 -c "CREATE TABLE kg.candidate_private_key (id integer primary key, secret_key bytea not null); INSERT INTO kg.candidate_private_key VALUES (1,decode(repeat('a',64),'hex'))"
      - run: psql -v ON_ERROR_STOP=1 -f infra/studio/editorial-management.sql
      - run: psql -v ON_ERROR_STOP=1 -f infra/studio/studio-media.sql
      - run: psql -v ON_ERROR_STOP=1 -f infra/studio/studio-media-info.sql
      - run: psql -v ON_ERROR_STOP=1 -f infra/studio/studio-media-info-test.sql
      - run: psql -v ON_ERROR_STOP=1 -f infra/studio/stage-reviewed-evidence.sql
      - run: psql -v ON_ERROR_STOP=1 -f infra/studio/bind-exact-studio-revision.sql
      - run: psql -v ON_ERROR_STOP=1 -c "CREATE ROLE kg_g1_reviewer_probe LOGIN"
      - run: psql -v ON_ERROR_STOP=1 -c "CREATE TABLE kg.attestation_private_key (id integer primary key, secret_key bytea not null); INSERT INTO kg.attestation_private_key VALUES (1,decode(repeat('c',64),'hex'))"
      - run: psql -v ON_ERROR_STOP=1 -f infra/studio/approve-reviewed-evidence.sql
      - run: psql -v ON_ERROR_STOP=1 -f infra/studio/evidence-role-connect.sql
      - run: psql -v ON_ERROR_STOP=1 -f infra/studio/stage-reviewed-evidence-test.sql

      - run: psql -v ON_ERROR_STOP=1 -f infra/studio/operator-review-migration.sql
      - run: psql -v ON_ERROR_STOP=1 -f infra/studio/source-title-conflict-migration.sql
      - run: psql -v ON_ERROR_STOP=1 -f infra/studio/private-review-staging-migration.sql
      - run: psql -v ON_ERROR_STOP=1 -f infra/studio/private-reviewed-publication-migration.sql
      - run: psql -v ON_ERROR_STOP=1 -f infra/studio/private-review-before-publication-test.sql

  build-editor:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: '1'
      STUDIO_CI_SYNTHETIC: 'true'
      G1_TRUSTED_ORIGIN: https://studio.example.invalid
      G1_COOKIE_SECURE: 'true'
      DATABASE_URL: postgres://kg_studio_ci:synthetic@127.0.0.1:5432/dechive_studio_ci
      PAYLOAD_SECRET: synthetic-secret-value-at-least-32-bytes
      G1_REVIEWER_DATABASE_URL: postgres://reviewer:synthetic@127.0.0.1:5432/test
      G1_PUBLISHER_DATABASE_URL: postgres://publisher:synthetic@127.0.0.1:5432/test
      G1_CANDIDATE_DATABASE_URL: postgres://candidate:synthetic@127.0.0.1:5432/test
      G1_REVIEW_ATTESTATION_SECRET: abcdefabcdefabcdefabcdefabcdefabcdefabcdefabcdefabcdefabcdefabcd
      G1_CANDIDATE_SECRET: abcdefabcdefabcdefabcdefabcdefabcdefabcdefabcdefabcdefabcdefabcd
      STUDIO_PUBLICATION_DATABASE_URL: postgres://publisher:synthetic@127.0.0.1:5432/test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.4'
      - run: python3 infra/studio/stage.py /tmp/studio-bridge
      - run: npm ci --prefix /tmp/studio-bridge --no-audit --no-fund
      - run: npm --prefix /tmp/studio-bridge run build:next
      - run: mkdir -p /tmp/studio-bridge/.next/standalone/.next && cp -R /tmp/studio-bridge/.next/static /tmp/studio-bridge/.next/standalone/.next/static && tar -C /tmp/studio-bridge/.next/standalone -czf /tmp/studio-publication.tgz .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: studio-publication-bridge
          path: /tmp/studio-publication.tgz
          retention-days: 7

  authenticated-multisource-http:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: studio_http
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d studio_http"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      PGPASSWORD: synthetic-ci-only
      PGHOST: 127.0.0.1
      PGUSER: postgres
      PGDATABASE: studio_http
      DATABASE_URL: postgres://postgres:synthetic-ci-only@127.0.0.1:5432/studio_http
      PUBLIC_DATABASE_URL: postgres://kg_public_http:synthetic@127.0.0.1:5432/studio_http
      STUDIO_PUBLICATION_DATABASE_URL: postgres://kg_studio_publish:synthetic@127.0.0.1:5432/studio_http
      G1_CANDIDATE_DATABASE_URL: postgres://kg_g1_candidate_probe:synthetic@127.0.0.1:5432/studio_http
      G1_REVIEWER_DATABASE_URL: postgres://kg_g1_reviewer_probe:synthetic@127.0.0.1:5432/studio_http
      G1_PUBLISHER_DATABASE_URL: postgres://kg_g1_reviewer_probe:synthetic@127.0.0.1:5432/studio_http
      G1_CANDIDATE_SECRET: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      G1_REVIEW_ATTESTATION_SECRET: cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc
      PAYLOAD_SECRET: synthetic-private-studio-secret-for-ci-only
      G1_TRUSTED_ORIGIN: http://127.0.0.1:3188
      G1_COOKIE_SECURE: 'false'
      NODE_ENV: development
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.4'
      - run: npm ci --prefix experiments/payload-g1 --no-audit --no-fund
      - run: psql -v ON_ERROR_STOP=1 -f db/001_knowledge_core_p0.sql
      - run: psql -v ON_ERROR_STOP=1 -f db/002_review_integrity_p0.sql
      - run: psql -v ON_ERROR_STOP=1 -v reader_password=synthetic -f experiments/payload-g1/sql/001_http_reader.sql
      - run: psql -v ON_ERROR_STOP=1 -f experiments/payload-g1/sql/006_public_evidence.sql
      - run: psql -v ON_ERROR_STOP=1 -f experiments/payload-g1/sql/007_revision_metadata.sql
      - run: psql -v ON_ERROR_STOP=1 -f infra/studio/direct-publication.sql
      - run: psql -v ON_ERROR_STOP=1 -c "CREATE ROLE kg_studio_publish LOGIN PASSWORD 'synthetic'; CREATE ROLE kg_g1_candidate_probe LOGIN PASSWORD 'synthetic'; CREATE ROLE kg_g1_reviewer_probe LOGIN PASSWORD 'synthetic'; GRANT USAGE ON SCHEMA kg TO kg_studio_publish; GRANT EXECUTE ON FUNCTION kg.publish_studio_draft(uuid,text,text,text,text) TO kg_studio_publish"
      - run: psql -v ON_ERROR_STOP=1 -c "CREATE TABLE kg.candidate_private_key (id integer primary key,secret_key bytea not null); INSERT INTO kg.candidate_private_key VALUES(1,decode(repeat('a',64),'hex')); CREATE TABLE kg.attestation_private_key (id integer primary key,secret_key bytea not null); INSERT INTO kg.attestation_private_key VALUES(1,decode(repeat('c',64),'hex'))"
      - run: psql -v ON_ERROR_STOP=1 -f infra/studio/editorial-management.sql
      - run: psql -v ON_ERROR_STOP=1 -f infra/studio/studio-media.sql
      - run: psql -v ON_ERROR_STOP=1 -f infra/studio/studio-media-info.sql
      - run: psql -v ON_ERROR_STOP=1 -f infra/studio/approved-evidence-bridge.sql
      - run: psql -v ON_ERROR_STOP=1 -f infra/studio/stage-reviewed-evidence.sql
      - run: psql -v ON_ERROR_STOP=1 -f infra/studio/bind-exact-studio-revision.sql
      - run: psql -v ON_ERROR_STOP=1 -f infra/studio/approve-reviewed-evidence.sql
      - run: psql -v ON_ERROR_STOP=1 -f infra/studio/evidence-role-connect.sql
      - run: psql -v ON_ERROR_STOP=1 -f infra/studio/operator-review-migration.sql
      - run: psql -v ON_ERROR_STOP=1 -f infra/studio/source-title-conflict-migration.sql
      - run: psql -v ON_ERROR_STOP=1 -f infra/studio/private-review-staging-migration.sql
      - run: psql -v ON_ERROR_STOP=1 -f infra/studio/private-reviewed-publication-migration.sql
      - run: cd experiments/payload-g1 && timeout --signal=SIGTERM --kill-after=10s 240s node --import tsx tests/studio-private-publication-http.ts
