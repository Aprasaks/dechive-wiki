name: Reader account and bookmark checks
on:
  workflow_dispatch:
  push:
    branches: [work/reader-account-bookmarks]
permissions:
  contents: read
jobs:
  member-integration:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: member_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d member_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgres://postgres:synthetic-ci-only@127.0.0.1:5432/member_test
      MEMBER_DATABASE_URL: postgres://postgres:synthetic-ci-only@127.0.0.1:5432/member_test
      MEMBER_BOOKMARK_TEST_URL: postgres://wiki_member_ci:member-ci-only@127.0.0.1:5432/member_test
      MEMBER_AUTH_URL: http://127.0.0.1:3120
      MEMBER_AUTH_SECRET: synthetic-ci-secret-only-not-for-production-123456789
      PGPASSWORD: synthetic-ci-only
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.4'
      - run: npm ci --no-audit --no-fund
        working-directory: experiments/payload-g1
      - run: psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d member_test -f infra/reader/member-bookmarks.sql
      - run: npx tsx tests/member-integration.ts
        working-directory: experiments/payload-g1
      - name: Prepare public article fixtures
        run: |
          for migration in db/00[1-4]_*.sql; do psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d member_test -f "$migration"; done
          psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d member_test -v reader_password=synthetic -f experiments/payload-g1/sql/001_http_reader.sql
          for file in 006_public_evidence.sql 007_revision_metadata.sql 012_public_related_entries.sql; do psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d member_test -f "experiments/payload-g1/sql/$file"; done
      - name: Test reader HTTP flows
        env:
          PUBLIC_DATABASE_URL: postgres://postgres:synthetic-ci-only@127.0.0.1:5432/member_test
        run: |
          python3 infra/reader/stage.py "$RUNNER_TEMP/member-reader"
          ln -s "$GITHUB_WORKSPACE/experiments/payload-g1/node_modules" "$RUNNER_TEMP/member-reader/node_modules"
          npm --prefix "$RUNNER_TEMP/member-reader" run build:next
          PORT=3120 HOSTNAME=127.0.0.1 npm --prefix "$RUNNER_TEMP/member-reader" run start:next > "$RUNNER_TEMP/member-reader.log" 2>&1 &
          server=$!
          trap 'kill "$server" || true' EXIT
          for i in $(seq 1 60); do if curl -fsS http://127.0.0.1:3120/robots.txt >/dev/null; then break; fi; sleep 1; done
          cd experiments/payload-g1
          npx tsx tests/member-http.ts || { cat "$RUNNER_TEMP/member-reader.log"; exit 1; }
